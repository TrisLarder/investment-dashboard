name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "15 17 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/fetch_markets.py

      - name: Commit updated market data
        run: |
          git config user.name "investment-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update market data"
            git push
          fi
